[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-keyword-expansion"
version = "1.0.0"
description = "Agent-assisted scientific keyword expansion and evidence-aware search reports"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
scientific-keywords = "scientific_keyword_expansion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
